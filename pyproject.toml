[project]
name = "tattva"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2",
    "rich>=15",
    "grandalf>=0.8",
    "jinja2>=3.1",
    "markdown-it-py>=4",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
tattva = "tattva.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tattva"]
